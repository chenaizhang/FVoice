name: Build & Release Latest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate version name
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="0.1.0-nightly-${DATE}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # ---------- Debug APK ----------
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename debug APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} FVoice-debug-${{ steps.version.outputs.version }}.apk \;

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FVoice-debug-${{ steps.version.outputs.version }}
          path: FVoice-debug-${{ steps.version.outputs.version }}.apk

      # ---------- Release APK ----------
      - name: Decode keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Keystore decoded"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set, release APK will not be signed"
          fi

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:assembleRelease

      - name: Rename release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} FVoice-release-${{ steps.version.outputs.version }}.apk \;

      - name: Upload release APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: FVoice-release-${{ steps.version.outputs.version }}
          path: FVoice-release-${{ steps.version.outputs.version }}.apk

      # ---------- Source code ----------
      - name: Package source code
        run: |
          zip -r FVoice-source-${{ steps.version.outputs.version }}.zip . \
            -x ".git/*" ".gradle/*" "app/build/*" "build/*" ".idea/*" "*.keystore" "*.jks" "local.properties" "tmp/*"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: FVoice-source-${{ steps.version.outputs.version }}
          path: FVoice-source-${{ steps.version.outputs.version }}.zip

      # ---------- GitHub Release ----------
      - name: Create/Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Nightly Build"
          body: |
            ## 🔄 Latest auto-built version

            **Version:** `${{ steps.version.outputs.version }}`
            **Commit:** `${{ github.sha }}`
            **Built at:** ${{ github.event.head_commit.timestamp }}

            ### 📦 Downloads
            | File | Description |
            |------|-------------|
            | `FVoice-debug-${{ steps.version.outputs.version }}.apk` | Debug 版本（无需签名即可安装） |
            | `FVoice-release-${{ steps.version.outputs.version }}.apk` | Release 版本（已签名，可直接发布） |
            | `FVoice-source-${{ steps.version.outputs.version }}.zip` | 源代码包 |
          prerelease: true
          files: |
            FVoice-debug-${{ steps.version.outputs.version }}.apk
            FVoice-release-${{ steps.version.outputs.version }}.apk
            FVoice-source-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
