name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release: ${VERSION} (${TAG})"

      # ---------- Debug APK ----------
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename debug APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} Clarivo-debug-${{ steps.version.outputs.version }}.apk \;

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clarivo-debug-${{ steps.version.outputs.version }}
          path: Clarivo-debug-${{ steps.version.outputs.version }}.apk

      # ---------- Release APK ----------
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:assembleRelease

      - name: Rename release APK
        run: |
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} Clarivo-release-${{ steps.version.outputs.version }}.apk \;

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clarivo-release-${{ steps.version.outputs.version }}
          path: Clarivo-release-${{ steps.version.outputs.version }}.apk

      # ---------- GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Clarivo ${{ steps.version.outputs.version }}"
          body: |
            > **Version** `${{ steps.version.outputs.version }}`
            > **Commit** `${{ github.sha }}`

            | File | Type |
            |------|------|
            | `Clarivo-debug-${{ steps.version.outputs.version }}.apk` | Debug |
            | `Clarivo-release-${{ steps.version.outputs.version }}.apk` | Release |
          prerelease: false
          files: |
            Clarivo-debug-${{ steps.version.outputs.version }}.apk
            Clarivo-release-${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
